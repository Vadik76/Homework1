[pytest]
# Lets tests import from the "pages" folder.
pythonpath = .
testpaths = tests
# Keep a screenshot and trace of any failed test in the test-results folder.
addopts = --screenshot only-on-failure --tracing retain-on-failure --strict-markers
# Tags used in the feature file. Run one group with e.g.: pytest -m negative
markers =
    positive: valid input, feature works as expected
    negative: invalid or unexpected input is handled safely
    boundary: edges of what the field accepts
